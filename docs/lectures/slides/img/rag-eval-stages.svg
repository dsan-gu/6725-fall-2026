<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 360" width="1080" height="360">
<defs>
<marker id="arrow-gray" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#6b7280"/>
</marker>
<marker id="arrow-amber" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#b45309"/>
</marker>
</defs>
<rect width="1080" height="360" fill="white"/>
<rect x="40" y="150" width="160" height="50" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="120" y="180" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">question</text>
<rect x="250" y="150" width="160" height="50" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="330" y="180" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">retriever</text>
<rect x="460" y="150" width="160" height="50" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="540" y="180" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">top-k chunks</text>
<rect x="670" y="150" width="160" height="50" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="750" y="180" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">generator</text>
<rect x="880" y="150" width="160" height="50" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="960" y="180" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">answer</text>
<line x1="200" y1="175" x2="246" y2="175" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
<line x1="410" y1="175" x2="456" y2="175" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
<line x1="620" y1="175" x2="666" y2="175" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
<line x1="830" y1="175" x2="876" y2="175" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
<rect x="145" y="40" width="370" height="70" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="330" y="65" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">RETRIEVAL METRICS</text>
<text x="330" y="88" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#b45309" text-anchor="middle">context precision, context recall, hit rate, MRR</text>
<line x1="330" y1="110" x2="330" y2="146" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
<rect x="590" y="40" width="370" height="70" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="775" y="65" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">GENERATION METRICS</text>
<text x="775" y="88" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#b45309" text-anchor="middle">faithfulness to the chunks, answer relevance</text>
<line x1="775" y1="110" x2="775" y2="146" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
<rect x="250" y="270" width="600" height="60" rx="8" fill="white" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="550" y="295" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle">END-TO-END: answer correctness against a golden set</text>
<text x="550" y="316" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">necessary, but it cannot tell you WHICH stage failed</text>
<line x1="430" y1="270" x2="350" y2="206" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow-gray)"/>
<line x1="680" y1="270" x2="760" y2="206" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow-gray)"/>
</svg>
