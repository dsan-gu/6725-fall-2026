<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560">
<defs>
<marker id="pr-ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#6b7280"/>
</marker>
<marker id="pr-arA" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#b45309"/>
</marker>
</defs>
<rect width="1080" height="560" fill="white"/>

<rect x="400" y="215" width="280" height="130" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2.5"/>
<text x="540" y="252" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">THE AGENT</text>
<text x="540" y="278" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b7280" text-anchor="middle">a model in a loop:</text>
<text x="540" y="297" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b7280" text-anchor="middle">everything else it needs</text>
<text x="540" y="316" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b7280" text-anchor="middle">is a primitive</text>

<rect x="80" y="50" width="250" height="105" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="205" y="84" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">TOOLS</text>
<text x="205" y="106" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">what the agent can do:</text>
<text x="205" y="123" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">MCP servers, tool schemas</text>
<text x="205" y="144" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="middle">week 6</text>
<line x1="300" y1="155" x2="440" y2="210" stroke="#6b7280" stroke-width="1.6" marker-end="url(#pr-ar)"/>

<rect x="750" y="50" width="250" height="105" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="875" y="84" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">IDENTITY</text>
<text x="875" y="106" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">who it acts as, and for whom:</text>
<text x="875" y="123" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">OAuth, token exchange, scopes</text>
<text x="875" y="144" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="middle">week 6</text>
<line x1="780" y1="155" x2="640" y2="210" stroke="#6b7280" stroke-width="1.6" marker-end="url(#pr-ar)"/>

<rect x="80" y="400" width="250" height="105" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="205" y="434" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">DEPLOYMENT</text>
<text x="205" y="456" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">where it runs: the container,</text>
<text x="205" y="473" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">/ping + /invocations, the platform</text>
<text x="205" y="494" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="middle">week 9</text>
<line x1="300" y1="400" x2="440" y2="350" stroke="#6b7280" stroke-width="1.6" marker-end="url(#pr-ar)"/>

<rect x="750" y="400" width="250" height="105" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="875" y="434" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">OBSERVABILITY</text>
<text x="875" y="456" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">what it did and why: OTel traces,</text>
<text x="875" y="473" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">sessions, spans, evals on top</text>
<text x="875" y="494" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="middle">weeks 7 and 8</text>
<line x1="780" y1="400" x2="640" y2="350" stroke="#6b7280" stroke-width="1.6" marker-end="url(#pr-ar)"/>

<rect x="415" y="440" width="250" height="105" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="540" y="474" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">MEMORY</text>
<text x="540" y="496" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">what it keeps between sessions:</text>
<text x="540" y="513" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">facts, preferences, history</text>
<text x="540" y="534" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#b45309" text-anchor="middle">today</text>
<line x1="540" y1="440" x2="540" y2="352" stroke="#b45309" stroke-width="1.8" marker-end="url(#pr-arA)"/>
</svg>
