<svg xmlns="http://www.w3.org/2000/svg" width="920" height="395" viewBox="0 0 920 395" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker>
</defs>

<rect x="40" y="118" width="210" height="124" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="145" y="144" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">The model</text>
<text x="145" y="169" font-size="12" fill="#374151" text-anchor="middle">Reads the messages and</text>
<text x="145" y="186" font-size="12" fill="#374151" text-anchor="middle">the tool schemas.</text>
<text x="145" y="211" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">Writes text. Runs nothing.</text>
<text x="145" y="230" font-size="12" fill="#374151" text-anchor="middle">It has no hands.</text>

<rect x="330" y="62" width="260" height="248" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
<text x="460" y="90" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">The harness</text>
<text x="460" y="109" font-size="12" fill="#b45309" text-anchor="middle">(your code: the loop)</text>
<line x1="350" y1="122" x2="570" y2="122" stroke="#b45309" stroke-width="1" stroke-dasharray="4,3"/>
<text x="352" y="150" font-size="13" fill="#111827">1. call the model</text>
<text x="352" y="180" font-size="13" fill="#111827">2. did it ask for a tool?</text>
<text x="352" y="210" font-size="13" font-weight="bold" fill="#111827">3. if yes, run it yourself</text>
<text x="352" y="240" font-size="13" fill="#111827">4. append the result</text>
<text x="352" y="270" font-size="13" fill="#111827">5. call the model again</text>
<text x="352" y="296" font-size="12" fill="#6b7280">This is where the agency lives.</text>

<rect x="670" y="118" width="210" height="124" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="775" y="144" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">Tools</text>
<rect x="686" y="158" width="178" height="32" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.3"/>
<text x="775" y="178" font-size="12" fill="#111827" text-anchor="middle">local: a function, in process</text>
<rect x="686" y="196" width="178" height="32" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.3"/>
<text x="775" y="216" font-size="12" fill="#111827" text-anchor="middle">remote: an HTTP or MCP call</text>

<line x1="328" y1="150" x2="252" y2="150" stroke="#6b7280" stroke-width="1.8" marker-end="url(#g)"/>
<text x="290" y="142" font-size="11" fill="#6b7280" text-anchor="middle">messages</text>
<text x="290" y="130" font-size="11" fill="#6b7280" text-anchor="middle">+ tool schemas</text>

<line x1="252" y1="212" x2="328" y2="212" stroke="#6b7280" stroke-width="1.8" marker-end="url(#g)"/>
<text x="290" y="232" font-size="11" fill="#6b7280" text-anchor="middle">"please call</text>
<text x="290" y="244" font-size="11" fill="#6b7280" text-anchor="middle">get_price(AAPL)"</text>

<line x1="592" y1="150" x2="668" y2="150" stroke="#b45309" stroke-width="1.8" marker-end="url(#o)"/>
<text x="630" y="136" font-size="11" fill="#b45309" text-anchor="middle">invoke</text>

<line x1="668" y1="212" x2="592" y2="212" stroke="#b45309" stroke-width="1.8" marker-end="url(#o)"/>
<text x="630" y="232" font-size="11" fill="#b45309" text-anchor="middle">result</text>

<path d="M 360 312 C 360 348, 560 348, 560 312" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#o)"/>
<text x="460" y="372" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">repeat until the model stops asking for tools, or you hit max iterations</text>

<text x="460" y="34" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">An agent is an LLM called in a loop by code that can act on its behalf</text>
</svg>
