<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" width="1080" height="470">
<defs>
<marker id="xa-ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#6b7280"/>
</marker>
<marker id="xa-arA" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#b45309"/>
</marker>
</defs>
<rect width="1080" height="470" fill="white"/>

<rect x="80" y="170" width="220" height="110" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="190" y="205" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">APP A</text>
<text x="190" y="228" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">Alice's AI agent lives here,</text>
<text x="190" y="246" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">signed in through company SSO</text>

<rect x="420" y="140" width="260" height="180" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
<text x="550" y="172" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">ENTERPRISE IdP</text>
<text x="550" y="192" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">Cross App Access console</text>
<rect x="445" y="205" width="210" height="95" rx="6" fill="white" stroke="#b45309" stroke-width="1.2"/>
<text x="550" y="226" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">the admin's matrix</text>
<text x="550" y="248" font-family="Courier, monospace" font-size="11.5" fill="#111827" text-anchor="middle">agent-A -&gt; App B   ALLOW</text>
<text x="550" y="268" font-family="Courier, monospace" font-size="11.5" fill="#111827" text-anchor="middle">agent-A -&gt; App C   DENY</text>
<text x="550" y="288" font-family="Courier, monospace" font-size="11.5" fill="#111827" text-anchor="middle">agent-A -&gt; App D   ALLOW</text>

<rect x="800" y="60" width="200" height="90" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="900" y="95" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle">APP B: CRM</text>
<text x="900" y="117" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">MCP server the agent needs</text>

<rect x="800" y="190" width="200" height="90" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="900" y="225" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle">APP C: FINANCE</text>
<text x="900" y="247" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">off limits to this agent</text>

<rect x="800" y="320" width="200" height="90" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="900" y="355" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle">APP D: WIKI</text>
<text x="900" y="377" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">read-only grant</text>

<line x1="300" y1="225" x2="412" y2="225" stroke="#6b7280" stroke-width="1.8" marker-end="url(#xa-ar)"/>
<text x="356" y="214" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle">every cross-app</text>
<text x="356" y="243" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle">request routes here</text>

<line x1="680" y1="185" x2="792" y2="115" stroke="#b45309" stroke-width="2" marker-end="url(#xa-arA)"/>
<text x="750" y="135" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#b45309" text-anchor="middle">ID-JAG issued</text>

<line x1="680" y1="235" x2="770" y2="235" stroke="#6b7280" stroke-width="1.8"/>
<line x1="758" y1="222" x2="784" y2="248" stroke="#111827" stroke-width="2.5"/>
<line x1="784" y1="222" x2="758" y2="248" stroke="#111827" stroke-width="2.5"/>
<text x="733" y="222" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle">no grant minted</text>

<line x1="680" y1="290" x2="792" y2="355" stroke="#b45309" stroke-width="2" marker-end="url(#xa-arA)"/>
<text x="755" y="340" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#b45309" text-anchor="middle">ID-JAG, read scope</text>

<text x="400" y="400" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#6b7280" text-anchor="start">one console governs every agent-to-app pair; revoke a row</text>
<text x="400" y="417" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#6b7280" text-anchor="start">and the access dies everywhere, with no app-by-app cleanup</text>
</svg>
