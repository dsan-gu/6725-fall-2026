<text x="900" y="252" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">OBSERVABILITY</text>
<text x="900" y="273" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle">OTel traces out of every turn;</text>
<text x="900" y="290" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle">the week 7 loop: traces feed</text>
<text x="900" y="307" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle">evals, evals gate deploys</text>
