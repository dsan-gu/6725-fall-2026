<text x="735" y="72" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">MODEL ENDPOINT</text>
<text x="735" y="93" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle">the LLM API the loop calls:</text>
<text x="735" y="110" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle">hosted or your own serving</text>
<line x1="670" y1="186" x2="720" y2="130" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ar)" marker-start="url(#ar2)"/>
