<text x="721" y="255" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">spans</text>
<rect x="380" y="410" width="300" height="100" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="530" y="442" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">MEMORY SYSTEM *</text>
<text x="530" y="463" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#b45309" text-anchor="middle">session state across turns, and</text>
<text x="530" y="480" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#b45309" text-anchor="middle">what the agent keeps across sessions</text>
<line x1="530" y1="340" x2="530" y2="402" stroke="#b45309" stroke-width="1.8" marker-end="url(#arA)"/>
<text x="543" y="375" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#b45309" text-anchor="start">read / write</text>
<rect x="770" y="410" width="260" height="100" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="900" y="442" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle">REMOTE TOOLS: MCP SERVERS</text>
<text x="900" y="463" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle">the week 6 story: tools live in</text>
<text x="900" y="480" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle">other services, behind a gateway</text>
<line x1="660" y1="340" x2="810" y2="406" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="745" y="380" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">tools/call</text>
<rect x="60" y="410" width="250" height="100" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="185" y="442" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle">OTHER AGENTS (A2A)</text>
<text x="185" y="463" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle">delegation across the trust</text>
<text x="185" y="480" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle">boundary, agent card first</text>
<line x1="400" y1="340" x2="250" y2="406" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="310" y="380" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">tasks</text>
<text x="530" y="548" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#b45309" text-anchor="middle">* memory gets its own lecture next week</text>
