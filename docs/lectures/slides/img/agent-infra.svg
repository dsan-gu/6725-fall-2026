<rect width="1080" height="575" fill="white"/>
<rect x="380" y="190" width="300" height="150" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2.5"/>
<text x="530" y="222" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">THE DEPLOYED AGENT</text>
<text x="530" y="246" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">your container:</text>
<text x="530" y="265" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">/ping + /invocations,</text>
<text x="530" y="284" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">the loop, the tools</text>
<text x="530" y="316" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">scaled and restarted by the platform</text>
<rect x="40" y="220" width="170" height="90" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
