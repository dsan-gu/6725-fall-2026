<text x="335" y="93" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle">who is calling, what may this</text>
<text x="335" y="110" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle">session touch: OAuth, token exchange</text>
