<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker><marker id="gg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker></defs>
<rect x="20" y="30" width="200" height="56" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="120" y="52" font-size="13" fill="#b45309" text-anchor="middle">"Who did Bohr work with,</text>
<text x="120" y="70" font-size="13" fill="#b45309" text-anchor="middle">and on what?"</text>
<line x1="220" y1="58" x2="262" y2="58" stroke="#6b7280" stroke-width="1.8" marker-end="url(#gg)"/>
<text x="241" y="48" font-size="11" fill="#6b7280" text-anchor="middle">entity:</text>
<text x="241" y="76" font-size="11" fill="#b45309" text-anchor="middle" font-weight="bold">Bohr</text>
<ellipse cx="400" cy="60" rx="62" ry="24" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="400" y="65" font-size="13" fill="#b45309" text-anchor="middle" font-weight="bold">Niels Bohr</text>
<ellipse cx="620" cy="60" rx="62" ry="24" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="620" y="65" font-size="13" fill="#b45309" text-anchor="middle" font-weight="bold">Heisenberg</text>
<ellipse cx="620" cy="160" rx="62" ry="24" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="620" y="165" font-size="13" fill="#b45309" text-anchor="middle" font-weight="bold">uncertainty principle</text>
<ellipse cx="400" cy="170" rx="62" ry="24" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="400" y="175" font-size="13" fill="#111827" text-anchor="middle" font-weight="normal">Copenhagen Institute</text>
<ellipse cx="620" cy="250" rx="62" ry="24" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="620" y="255" font-size="13" fill="#111827" text-anchor="middle" font-weight="normal">Pauli</text>
<line x1="462" y1="60" x2="556" y2="60" stroke="#b45309" stroke-width="2.2" marker-end="url(#ga)"/>
<text x="509.0" y="54.0" font-size="11" fill="#b45309" text-anchor="middle" font-style="italic">collaborated with</text>
<line x1="620" y1="84" x2="620" y2="134" stroke="#b45309" stroke-width="2.2" marker-end="url(#ga)"/>
<text x="680" y="103.0" font-size="11" fill="#b45309" text-anchor="middle" font-style="italic">co-developed</text>
<line x1="400" y1="84" x2="400" y2="144" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#gg)"/>
<text x="365" y="108.0" font-size="11" fill="#9ca3af" text-anchor="middle" font-style="italic">founded</text>
<line x1="575" y1="180" x2="575" y2="228" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#gg)"/>
<text x="550" y="198.0" font-size="11" fill="#9ca3af" text-anchor="middle" font-style="italic">visited</text>
<line x1="700" y1="110" x2="742" y2="110" stroke="#6b7280" stroke-width="1.8" marker-end="url(#gg)"/>
<rect x="744" y="70" width="156" height="86" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="822" y="94" font-size="12" fill="#b45309" text-anchor="middle">the traversed subgraph</text>
<text x="822" y="112" font-size="12" fill="#b45309" text-anchor="middle">(entities + relations)</text>
<text x="822" y="130" font-size="12" fill="#b45309" text-anchor="middle">goes into the prompt</text>
<text x="822" y="148" font-size="12" fill="#b45309" text-anchor="middle">as context</text>
<text x="20" y="262" font-size="13" fill="#374151">Multi-hop questions follow edges: Bohr &#8594; collaborated with &#8594; Heisenberg &#8594; co-developed &#8594; uncertainty principle.</text>
<text x="20" y="282" font-size="13" fill="#374151">Chunked text scatters these facts across documents; the graph keeps the connections explicit and walkable.</text>
</svg>
