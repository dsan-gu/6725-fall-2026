<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker>
</defs>

<text x="310" y="30" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">One call to the model: everything it sees</text>

<rect x="100" y="46" width="420" height="48" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="116" y="70" font-size="14" font-weight="bold" fill="#111827">System prompt</text>
<text x="116" y="87" font-size="12" fill="#374151">who the agent is, what it may and may not do</text>

<rect x="100" y="98" width="420" height="62" rx="6" fill="#eff6ff" stroke="#1e40af" stroke-width="1.5"/>
<text x="116" y="121" font-size="14" font-weight="bold" fill="#1e40af">Tool schemas</text>
<text x="116" y="138" font-size="12" fill="#374151">for each tool: name, description, JSON input schema</text>
<text x="116" y="153" font-size="12" fill="#374151">this is the whole menu, every call, whether used or not</text>

<rect x="100" y="164" width="420" height="62" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
<text x="116" y="187" font-size="14" font-weight="bold" fill="#111827">User context</text>
<text x="116" y="204" font-size="12" fill="#374151">retrieved chunks, file contents, memory, prior decisions</text>
<text x="116" y="219" font-size="12" fill="#374151">everything you decided it needs to know</text>

<rect x="100" y="230" width="420" height="44" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
<text x="116" y="252" font-size="14" font-weight="bold" fill="#111827">User instructions</text>
<text x="116" y="268" font-size="12" fill="#374151">the actual task -- usually the smallest part</text>

<rect x="100" y="278" width="420" height="94" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
<text x="116" y="301" font-size="14" font-weight="bold" fill="#b45309">The conversation so far</text>
<text x="116" y="320" font-size="12" fill="#374151">turn 1: assistant asked for get_price("AAPL")</text>
<text x="116" y="336" font-size="12" fill="#374151">turn 1: tool result -> 232.80</text>
<text x="116" y="352" font-size="12" fill="#374151">turn 2: assistant asked for get_price("MSFT") ...</text>
<text x="116" y="367" font-size="12" font-style="italic" fill="#b45309">one assistant turn + one tool result, every iteration</text>

<path d="M 536 50 C 556 50, 556 206, 572 206" fill="none" stroke="#6b7280" stroke-width="1.5"/>
<path d="M 536 270 C 556 270, 556 206, 572 206" fill="none" stroke="#6b7280" stroke-width="1.5"/>
<line x1="572" y1="206" x2="592" y2="206" stroke="#6b7280" stroke-width="1.5" marker-end="url(#g)"/>
<text x="604" y="196" font-size="13" font-weight="bold" fill="#111827">Mostly fixed</text>
<text x="604" y="214" font-size="12" fill="#374151">but you pay for it</text>
<text x="604" y="230" font-size="12" fill="#374151">on every single call</text>

<line x1="524" y1="325" x2="592" y2="325" stroke="#b45309" stroke-width="2" marker-end="url(#o)"/>
<text x="604" y="310" font-size="13" font-weight="bold" fill="#b45309">This part grows</text>
<text x="604" y="328" font-size="12" fill="#374151">The loop appends to it</text>
<text x="604" y="344" font-size="12" fill="#374151">and resends all of it,</text>
<text x="604" y="360" font-size="12" fill="#374151">every iteration.</text>

<rect x="596" y="46" width="300" height="118" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="746" y="70" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">There is no hidden state</text>
<text x="612" y="92" font-size="12" fill="#374151">The model remembers nothing between</text>
<text x="612" y="109" font-size="12" fill="#374151">calls. Each call is a cold read of this</text>
<text x="612" y="126" font-size="12" fill="#374151">whole stack. "Memory" and "context"</text>
<text x="612" y="143" font-size="12" fill="#374151">are just things your harness chooses to</text>
<text x="612" y="157" font-size="12" fill="#374151">put back in the next one.</text>
</svg>
