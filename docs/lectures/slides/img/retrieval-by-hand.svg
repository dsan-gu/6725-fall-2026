<path d="M 279.0 220.0 L 288.0 211.0 L 297.0 220.0 L 288.0 229.0 Z" fill="#111827"/>
<text x="218" y="248" font-size="13" font-weight="bold" fill="#111827">query q</text>
<text x="430" y="40" font-size="14" font-weight="bold" fill="#111827">cosine similarity to q ("What happened to cab prices?")</text>
<text x="430" y="72" font-size="13" fill="#b45309" font-weight="bold">D1: "Taxi fares rose 4% in January"</text>
<rect x="430" y="78" width="180" height="10" rx="3" fill="#b45309" opacity="0.8"/>
<text x="618" y="87" font-size="12" fill="#b45309" font-weight="bold">0.998</text>
<text x="430" y="110" font-size="13" fill="#b45309" font-weight="bold">D3: "Congestion pricing cut traffic"</text>
<rect x="430" y="116" width="175" height="10" rx="3" fill="#b45309" opacity="0.8"/>
<text x="613" y="125" font-size="12" fill="#b45309" font-weight="bold">0.974</text>
<text x="430" y="148" font-size="13" fill="#6b7280" font-weight="normal">D4: "Best pizza slices in Brooklyn"</text>
<rect x="430" y="154" width="104" height="10" rx="3" fill="#6b7280" opacity="0.8"/>
<text x="542" y="163" font-size="12" fill="#6b7280" font-weight="bold">0.578</text>
<text x="430" y="186" font-size="13" fill="#6b7280" font-weight="normal">D2: "The Knicks won last night"</text>
<rect x="430" y="192" width="64" height="10" rx="3" fill="#6b7280" opacity="0.8"/>
<text x="502" y="201" font-size="12" fill="#6b7280" font-weight="bold">0.354</text>
<text x="430" y="248" font-size="13" fill="#111827">top-2 by similarity (D1, D3) go into the prompt as context;</text>
<text x="430" y="268" font-size="13" fill="#111827">the model answers from them and cites them.</text>
<text x="430" y="298" font-size="12" fill="#6b7280">Real systems: 1024+ dimensions, millions of documents, ANN index.</text>
