<svg xmlns="http://www.w3.org/2000/svg" width="920" height="320" viewBox="0 0 920 320" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker></defs>
<text x="200" y="34" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">One-shot RAG: retrieval guesses once</text>
<rect x="120" y="55" width="160" height="36" rx="7" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="200.0" y="78.0" font-size="14" fill="#111827" text-anchor="middle">query</text>
<line x1="200" y1="91" x2="200" y2="113" stroke="#6b7280" stroke-width="1.5" marker-end="url(#g)"/>
<rect x="120" y="115" width="160" height="36" rx="7" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="200.0" y="138.0" font-size="14" fill="#111827" text-anchor="middle">retrieve top-k</text>
<line x1="200" y1="151" x2="200" y2="173" stroke="#6b7280" stroke-width="1.5" marker-end="url(#g)"/>
<rect x="120" y="175" width="160" height="36" rx="7" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="200.0" y="198.0" font-size="14" fill="#111827" text-anchor="middle">generate</text>
<line x1="200" y1="211" x2="200" y2="233" stroke="#6b7280" stroke-width="1.5" marker-end="url(#g)"/>
<rect x="120" y="235" width="160" height="36" rx="7" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="200.0" y="258.0" font-size="14" fill="#111827" text-anchor="middle">answer</text>
<text x="200" y="300" font-size="13" fill="#6b7280" text-anchor="middle">retrieval happens before the model</text>
<text x="200" y="316" font-size="13" fill="#6b7280" text-anchor="middle">has read anything</text>
<text x="640" y="34" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">Agentic RAG: the model drives retrieval</text>
<rect x="560" y="55" width="160" height="36" rx="7" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="640.0" y="78.0" font-size="14" fill="#111827" text-anchor="middle">question</text>
<line x1="640" y1="91" x2="640" y2="113" stroke="#6b7280" stroke-width="1.5" marker-end="url(#g)"/>
<rect x="540" y="115" width="200" height="56" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="640.0" y="135" font-size="14" fill="#b45309" text-anchor="middle">model reads, decides:</text>
<text x="640.0" y="153" font-size="14" fill="#b45309" text-anchor="middle">"I need X next"</text>
<rect x="790" y="115" width="110" height="56" rx="7" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="845.0" y="135" font-size="14" fill="#111827" text-anchor="middle">tools:</text>
<text x="845.0" y="153" font-size="14" fill="#111827" text-anchor="middle">search, SQL, ...</text>
<path d="M 742 130 L 788 130" stroke="#b45309" stroke-width="2" marker-end="url(#o)"/>
<path d="M 788 156 L 742 156" stroke="#b45309" stroke-width="2" marker-end="url(#o)"/>
<text x="765" y="122" font-size="11" fill="#b45309" text-anchor="middle">ask</text>
<text x="765" y="172" font-size="11" fill="#b45309" text-anchor="middle">result</text>
<path d="M 540 143 C 490 143, 490 200, 540 200" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="483" y="176" font-size="11" fill="#b45309" text-anchor="middle">repeat</text>
<rect x="540" y="185" width="200" height="30" rx="7" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
<text x="640.0" y="205.0" font-size="13" fill="#111827" text-anchor="middle">enough context?</text>
<line x1="640" y1="215" x2="640" y2="237" stroke="#6b7280" stroke-width="1.5" marker-end="url(#g)"/>
<rect x="560" y="239" width="160" height="36" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="640.0" y="262.0" font-size="14" fill="#b45309" text-anchor="middle">grounded answer</text>
<text x="640" y="300" font-size="13" fill="#6b7280" text-anchor="middle">each round of reading tells the model</text>
<text x="640" y="316" font-size="13" fill="#6b7280" text-anchor="middle">what to fetch next</text>
</svg>
