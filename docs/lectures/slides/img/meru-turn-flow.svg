<line x1="690" y1="218" x2="756" y2="180" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow-gray)"/>
<line x1="690" y1="293" x2="756" y2="180" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow-gray)"/>
<line x1="865" y1="220" x2="865" y2="268" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
<rect x="760" y="272" width="210" height="50" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
