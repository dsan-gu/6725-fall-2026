<line x1="345" y1="224" x2="345" y2="366" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>
<line x1="865" y1="326" x2="865" y2="366" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>
