<svg xmlns="http://www.w3.org/2000/svg" width="920" height="200" viewBox="0 0 920 200" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="tr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker></defs>
<rect x="40" y="30" width="220" height="130" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="150" y="54" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">stdio</text>
<text x="150" y="72" font-size="11" fill="#6b7280" text-anchor="middle">Nov 2024</text>
<text x="150" y="92" font-size="11.5" fill="#111827" text-anchor="middle">local only: client launches</text>
<text x="150" y="108" font-size="11.5" fill="#111827" text-anchor="middle">the server as a child process,</text>
<text x="150" y="124" font-size="11.5" fill="#111827" text-anchor="middle">JSON-RPC over stdin/stdout</text>
<rect x="350" y="30" width="220" height="130" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="460" y="54" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">HTTP + SSE</text>
<text x="460" y="72" font-size="11" fill="#6b7280" text-anchor="middle">early spec</text>
<text x="460" y="92" font-size="11.5" fill="#111827" text-anchor="middle">first remote transport:</text>
<text x="460" y="108" font-size="11.5" fill="#111827" text-anchor="middle">two endpoints, server-push</text>
<text x="460" y="124" font-size="11.5" fill="#111827" text-anchor="middle">via Server-Sent Events</text>
<text x="460" y="140" font-size="11.5" fill="#111827" text-anchor="middle">(deprecated, 2025-03-26 spec)</text>
<rect x="660" y="30" width="220" height="130" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="770" y="54" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">Streamable HTTP</text>
<text x="770" y="72" font-size="11" fill="#6b7280" text-anchor="middle">current standard</text>
<text x="770" y="92" font-size="11.5" fill="#b45309" text-anchor="middle">one endpoint, plain HTTP;</text>
<text x="770" y="108" font-size="11.5" fill="#b45309" text-anchor="middle">upgrades to SSE only when</text>
<text x="770" y="124" font-size="11.5" fill="#b45309" text-anchor="middle">streaming is needed;</text>
<text x="770" y="140" font-size="11.5" fill="#b45309" text-anchor="middle">stateless servers possible</text>
<line x1="260" y1="95" x2="348" y2="95" stroke="#6b7280" stroke-width="2" marker-end="url(#tr)"/>
<line x1="570" y1="95" x2="658" y2="95" stroke="#6b7280" stroke-width="2" marker-end="url(#tr)"/>
<text x="40" y="188" font-size="12" fill="#374151">stdio remains the right choice for local servers; Streamable HTTP is the standard for everything remote.</text>
</svg>
