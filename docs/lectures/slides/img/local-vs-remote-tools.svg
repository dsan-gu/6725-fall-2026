<svg xmlns="http://www.w3.org/2000/svg" width="920" height="350" viewBox="0 0 920 350" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e40af"/></marker>
</defs>

<rect x="30" y="48" width="350" height="246" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="7,4"/>
<text x="205" y="40" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">your process</text>

<rect x="60" y="74" width="290" height="62" rx="7" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="205" y="97" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">Local tool</text>
<text x="205" y="118" font-size="13" fill="#111827" text-anchor="middle" font-family="Fira Mono, monospace">def get_price(ticker): ...</text>

<line x1="205" y1="176" x2="205" y2="140" stroke="#b45309" stroke-width="2" marker-end="url(#o)" marker-start="url(#o)"/>
<text x="275" y="152" font-size="12" fill="#b45309" text-anchor="middle">a function call</text>
<text x="275" y="167" font-size="12" fill="#b45309" text-anchor="middle">microseconds</text>

<rect x="60" y="178" width="290" height="68" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
<text x="205" y="202" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">The harness</text>
<text x="205" y="223" font-size="12" fill="#b45309" text-anchor="middle">decides which tool to run,</text>
<text x="205" y="238" font-size="12" fill="#b45309" text-anchor="middle">then runs it</text>

<text x="205" y="270" font-size="12" fill="#374151" text-anchor="middle">Same memory, no network, no auth.</text>
<text x="205" y="286" font-size="12" fill="#374151" text-anchor="middle">Your code, your dependencies, your crash.</text>

<line x1="410" y1="20" x2="410" y2="330" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,5"/>
<text x="424" y="180" font-size="12" font-weight="bold" fill="#6b7280" transform="rotate(-90 424 180)" text-anchor="middle">network boundary</text>

<line x1="352" y1="212" x2="488" y2="212" stroke="#1e40af" stroke-width="2" marker-end="url(#b)"/>
<text x="448" y="202" font-size="11" fill="#1e40af" text-anchor="middle">request</text>

<text x="700" y="40" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">somewhere else</text>

<rect x="490" y="74" width="400" height="56" rx="7" fill="#eff6ff" stroke="#1e40af" stroke-width="1.5"/>
<text x="506" y="96" font-size="13" font-weight="bold" fill="#1e40af">Remote tool: a REST API</text>
<text x="506" y="117" font-size="12" fill="#374151">the harness makes an HTTP call and waits</text>

<rect x="490" y="140" width="400" height="70" rx="7" fill="#eff6ff" stroke="#1e40af" stroke-width="2.5"/>
<text x="506" y="162" font-size="13" font-weight="bold" fill="#1e40af">Remote tool: an MCP server</text>
<text x="506" y="182" font-size="12" fill="#374151">same idea, but the tool list and schemas are</text>
<text x="506" y="199" font-size="12" fill="#374151">discovered at runtime instead of hard-coded</text>

<rect x="490" y="220" width="400" height="56" rx="7" fill="#eff6ff" stroke="#1e40af" stroke-width="1.5"/>
<text x="506" y="242" font-size="13" font-weight="bold" fill="#1e40af">Remote tool: another team's agent</text>
<text x="506" y="263" font-size="12" fill="#374151">now you need a protocol for agents (A2A, week 11)</text>

<text x="690" y="300" font-size="12" fill="#374151" text-anchor="middle">Latency, auth, rate limits, retries, and someone else's uptime.</text>
<text x="690" y="316" font-size="12" font-weight="bold" fill="#111827" text-anchor="middle">The model cannot tell the difference. Only your harness knows.</text>
</svg>
