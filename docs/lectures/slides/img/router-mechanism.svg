<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 350" width="1060" height="350">
<defs>
<marker id="arrow-gray" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#6b7280"/>
</marker>
<marker id="arrow-amber" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#b45309"/>
</marker>
<marker id="arrow-ink" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#111827"/>
</marker>
</defs>
<rect width="1060" height="350" fill="white"/>
<rect x="30" y="90" width="220" height="120" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="140" y="120" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">THE PROMPT</text>
<text x="140" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">four lettered options A-D,</text>
<text x="140" y="165" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">folders, tools, examples,</text>
<text x="140" y="184" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">then the question</text>
<rect x="290" y="90" width="220" height="120" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="400" y="120" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">ONE TOKEN</text>
<text x="400" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">Ollama returns 1 token</text>
<text x="400" y="165" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">with log probabilities,</text>
<text x="400" y="184" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">thinking off</text>
<rect x="550" y="90" width="220" height="120" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="660" y="120" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">FOUR NUMBERS</text>
<text x="660" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#b45309" text-anchor="middle">A 0.049   B 0.473</text>
<text x="660" y="165" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#b45309" text-anchor="middle">C 0.260   D 0.218</text>
<rect x="810" y="90" width="220" height="120" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="920" y="120" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">DECISION RULE</text>
<text x="920" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">top: take the winner</text>
<text x="920" y="165" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">marginal: sum the</text>
<text x="920" y="184" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">search and tool evidence</text>
<line x1="250" y1="150" x2="286" y2="150" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
<line x1="510" y1="150" x2="546" y2="150" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
<line x1="770" y1="150" x2="806" y2="150" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
<line x1="920" y1="210" x2="920" y2="262" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
<rect x="810" y="266" width="220" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="920" y="290" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle">route + confidence</text>
<text x="920" y="310" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle">below 0.45: fallback, search+tools</text>
<text x="530" y="40" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">The router never writes JSON: the answer is read from the logits</text>
<text x="530" y="62" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">it cannot invent a fifth route, and the turn pays for one decoded token</text>
</svg>
