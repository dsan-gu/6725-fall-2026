<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker></defs>
<rect x="40" y="60" width="480" height="70" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="280" y="90" font-size="15" fill="#111827" text-anchor="middle">what the model saw in training</text>
<text x="280" y="112" font-size="13" fill="#6b7280" text-anchor="middle">public web, books, code -- up to the cutoff</text>
<line x1="40" y1="170" x2="880" y2="170" stroke="#374151" stroke-width="2"/>
<line x1="520" y1="50" x2="520" y2="190" stroke="#111827" stroke-width="2" stroke-dasharray="6,4"/>
<text x="520" y="215" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">training cutoff</text>
<text x="870" y="192" font-size="13" fill="#6b7280" text-anchor="end">time</text>
<rect x="600" y="60" width="260" height="70" rx="8" fill="#fffbeb" stroke="#b45309"/>
<text x="730" y="86" font-size="14" fill="#b45309" text-anchor="middle">"What did the Fed announce</text>
<text x="730" y="106" font-size="14" fill="#b45309" text-anchor="middle">this morning?"</text>
<path d="M 700 132 L 620 168" stroke="#b45309" stroke-width="1.5" marker-end="url(#t)" fill="none"/>
<rect x="70" y="230" width="420" height="52" rx="8" fill="#fffbeb" stroke="#b45309"/>
<text x="280" y="252" font-size="14" fill="#b45309" text-anchor="middle">your private data: laptop files, company wiki,</text>
<text x="280" y="271" font-size="14" fill="#b45309" text-anchor="middle">sales database -- never in anyone's training set</text>
<path d="M 280 228 L 280 136" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#t)" fill="none"/>
<text x="315" y="185" font-size="12" fill="#b45309">not in here</text>
<text x="600" y="252" font-size="14" font-weight="bold" fill="#111827">Ask about either anyway, and the model</text>
<text x="600" y="272" font-size="14" font-weight="bold" fill="#111827">answers: fluent, confident, wrong.</text>
</svg>
