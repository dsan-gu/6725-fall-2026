<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" width="920" height="450">
<defs>
<marker id="arrow-gray" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#6b7280"/>
</marker>
<marker id="arrow-ink" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#111827"/>
</marker>
<marker id="arrow-amber" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#b45309"/>
</marker>
</defs>
<rect width="920" height="450" fill="white"/>
<rect x="60" y="16" width="220" height="46" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="170" y="44" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">Client agent</text>
<rect x="640" y="16" width="220" height="46" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="750" y="44" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">Remote agent</text>
<line x1="170" y1="62" x2="170" y2="440" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="750" y1="62" x2="750" y2="440" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="170" y1="100" x2="744" y2="100" stroke="#111827" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="460" y="92" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#111827" text-anchor="middle">1. GET /.well-known/agent-card.json</text>
<line x1="750" y1="135" x2="176" y2="135" stroke="#111827" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-ink)"/>
<text x="460" y="127" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#111827" text-anchor="middle">2. agent card: skills, endpoint, required auth</text>
<rect x="305" y="155" width="310" height="34" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="460" y="177" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">3. get token from the IdP (out-of-band)</text>
<line x1="170" y1="225" x2="744" y2="225" stroke="#111827" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="460" y="217" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#111827" text-anchor="middle">4. message/send + token -- task created (submitted)</text>
<line x1="750" y1="262" x2="176" y2="262" stroke="#111827" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-ink)"/>
<text x="460" y="254" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#111827" text-anchor="middle">5. SSE: status = working</text>
<line x1="750" y1="300" x2="176" y2="300" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-amber)"/>
<text x="460" y="292" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">6. SSE: status = input-required</text>
<line x1="170" y1="338" x2="744" y2="338" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
<text x="460" y="330" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">7. message with the missing input</text>
<line x1="750" y1="380" x2="176" y2="380" stroke="#111827" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-ink)"/>
<text x="460" y="372" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#111827" text-anchor="middle">8. SSE: completed + artifacts</text>
<text x="460" y="428" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">one task, many turns -- the client never sees the remote agent's internals, only states and artifacts</text>
</svg>
