<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540">
<defs>
<marker id="ts-ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#6b7280"/>
</marker>
<marker id="ts-ar2" markerWidth="9" markerHeight="7" refX="1" refY="3.5" orient="auto-start-reverse">
  <polygon points="0 0, 9 3.5, 0 7" fill="#6b7280"/>
</marker>
<marker id="ts-arA" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#b45309"/>
</marker>
</defs>
<rect width="1080" height="540" fill="white"/>

<rect x="50" y="200" width="200" height="80" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="150" y="235" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">SUBMITTED</text>
<text x="150" y="258" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">accepted, not started</text>

<rect x="390" y="200" width="200" height="80" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="490" y="235" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">WORKING</text>
<text x="490" y="258" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">the remote agent runs</text>
<line x1="250" y1="240" x2="382" y2="240" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ts-ar)"/>

<rect x="310" y="50" width="180" height="70" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="400" y="80" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle">AUTH_REQUIRED</text>
<text x="400" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">needs credentials first</text>
<line x1="430" y1="120" x2="470" y2="194" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ts-ar)" marker-start="url(#ts-ar2)"/>

<rect x="390" y="400" width="200" height="80" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="490" y="433" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">INPUT_REQUIRED</text>
<text x="490" y="456" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">paused: asks the client a question</text>
<line x1="465" y1="280" x2="465" y2="392" stroke="#b45309" stroke-width="1.8" marker-end="url(#ts-arA)"/>
<line x1="515" y1="392" x2="515" y2="288" stroke="#b45309" stroke-width="1.8" marker-end="url(#ts-arA)"/>
<text x="585" y="345" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="start">client answers with</text>
<text x="585" y="361" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="start">SendMessage + taskId</text>

<rect x="800" y="70" width="220" height="70" rx="8" fill="#f3f4f6" stroke="#111827" stroke-width="2.5"/>
<text x="910" y="100" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">COMPLETED</text>
<text x="910" y="121" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">artifacts attached</text>
<line x1="590" y1="215" x2="792" y2="120" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ts-ar)"/>

<rect x="800" y="200" width="220" height="70" rx="8" fill="#f3f4f6" stroke="#111827" stroke-width="2.5"/>
<text x="910" y="230" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">FAILED</text>
<text x="910" y="251" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">error surfaced to the client</text>
<line x1="590" y1="240" x2="792" y2="237" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ts-ar)"/>

<rect x="800" y="330" width="220" height="70" rx="8" fill="#f3f4f6" stroke="#111827" stroke-width="2.5"/>
<text x="910" y="360" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">CANCELED</text>
<text x="910" y="381" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">client called CancelTask</text>
<line x1="590" y1="265" x2="792" y2="355" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ts-ar)"/>

<rect x="50" y="400" width="200" height="70" rx="8" fill="#f3f4f6" stroke="#111827" stroke-width="2.5"/>
<text x="150" y="430" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">REJECTED</text>
<text x="150" y="451" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">the agent declines the task</text>
<line x1="150" y1="280" x2="150" y2="392" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ts-ar)"/>

<text x="910" y="430" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle" font-style="italic">thick border = terminal:</text>
<text x="910" y="447" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle" font-style="italic">the task never leaves this state</text>

<text x="540" y="520" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle" font-style="italic">on the wire these serialize as TASK_STATE_SUBMITTED, TASK_STATE_WORKING, ... (A2A 1.0 enum names)</text>
</svg>
