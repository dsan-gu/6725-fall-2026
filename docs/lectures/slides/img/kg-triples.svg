<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 330" width="1080" height="330">
<defs>
<marker id="kg-ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#6b7280"/>
</marker>
</defs>
<rect width="1080" height="330" fill="white"/>

<text x="230" y="40" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">THE TRIPLES</text>
<text x="230" y="80" font-family="Courier, monospace" font-size="13" fill="#111827" text-anchor="middle">(Bohr, bornIn, Copenhagen)</text>
<text x="230" y="105" font-family="Courier, monospace" font-size="13" fill="#111827" text-anchor="middle">(Bohr, collaboratedWith, Heisenberg)</text>
<text x="230" y="130" font-family="Courier, monospace" font-size="13" fill="#111827" text-anchor="middle">(Heisenberg, developed,</text>
<text x="230" y="150" font-family="Courier, monospace" font-size="13" fill="#111827" text-anchor="middle"> UncertaintyPrinciple)</text>
<text x="230" y="205" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#6b7280" text-anchor="middle">each line: (subject, predicate, object)</text>

<line x1="420" y1="160" x2="470" y2="160" stroke="#b45309" stroke-width="2.2" marker-end="url(#kg-ar)"/>
<text x="445" y="148" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle">compose</text>

<text x="790" y="40" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">THE GRAPH</text>

<ellipse cx="620" cy="120" rx="55" ry="28" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="620" y="126" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle">Bohr</text>

<ellipse cx="560" cy="260" rx="78" ry="28" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8"/>
<text x="560" y="266" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111827" text-anchor="middle">Copenhagen</text>
<line x1="605" y1="148" x2="572" y2="231" stroke="#6b7280" stroke-width="1.6" marker-end="url(#kg-ar)"/>
<text x="550" y="195" font-family="Courier, monospace" font-size="11" fill="#6b7280" text-anchor="end">bornIn</text>

<ellipse cx="850" cy="120" rx="78" ry="28" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="850" y="126" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle">Heisenberg</text>
<line x1="676" y1="120" x2="763" y2="120" stroke="#6b7280" stroke-width="1.6" marker-end="url(#kg-ar)"/>
<text x="719" y="108" font-family="Courier, monospace" font-size="11" fill="#6b7280" text-anchor="middle">collaboratedWith</text>

<ellipse cx="880" cy="260" rx="120" ry="28" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8"/>
<text x="880" y="266" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111827" text-anchor="middle">UncertaintyPrinciple</text>
<line x1="858" y1="148" x2="874" y2="231" stroke="#6b7280" stroke-width="1.6" marker-end="url(#kg-ar)"/>
<text x="885" y="195" font-family="Courier, monospace" font-size="11" fill="#6b7280" text-anchor="start">developed</text>

<text x="790" y="315" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#6b7280" text-anchor="middle">a multi-hop question just follows edges: where was the person who developed it born?</text>
</svg>
