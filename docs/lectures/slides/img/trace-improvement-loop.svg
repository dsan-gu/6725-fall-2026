<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 390" width="1040" height="390">
<defs>
<marker id="arrow-gray" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#6b7280"/>
</marker>
<marker id="arrow-amber" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#b45309"/>
</marker>
</defs>
<rect width="1040" height="390" fill="white"/>
<rect x="40" y="50" width="200" height="96" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="140" y="82" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">TRACES</text>
<text x="140" y="106" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">sessions/*.jsonl,</text>
<text x="140" y="124" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">every turn and tool call</text>
<rect x="290" y="50" width="200" height="96" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="390" y="82" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">A FAILURE</text>
<text x="390" y="106" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#b45309" text-anchor="middle">one real turn</text>
<text x="390" y="124" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#b45309" text-anchor="middle">routed wrong</text>
<rect x="540" y="50" width="200" height="96" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="640" y="82" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">A CLASS</text>
<text x="640" y="106" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">grep finds its</text>
<text x="640" y="124" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">siblings in the logs</text>
<rect x="790" y="50" width="200" height="96" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="890" y="82" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">A LABELED SET</text>
<text x="890" y="106" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">162 questions,</text>
<text x="890" y="124" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">fit / held-out split</text>
<rect x="790" y="250" width="200" height="96" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="890" y="282" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">A HARNESS</text>
<text x="890" y="306" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">accuracy, missed rate,</text>
<text x="890" y="324" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">calibration, latency</text>
<rect x="540" y="250" width="200" height="96" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="640" y="282" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">A CHANGE</text>
<text x="640" y="306" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#b45309" text-anchor="middle">the marginal rule,</text>
<text x="640" y="324" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#b45309" text-anchor="middle">behind a config flag</text>
<rect x="290" y="250" width="200" height="96" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="390" y="282" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">A REGRESSION SUITE</text>
<text x="390" y="306" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">meru check,</text>
<text x="390" y="324" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">38 golden questions</text>
<rect x="40" y="250" width="200" height="96" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="140" y="282" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">SHIP</text>
<text x="140" y="306" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">and the traces keep</text>
<text x="140" y="324" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">accumulating evidence</text>
<line x1="240" y1="98" x2="286" y2="98" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
<line x1="490" y1="98" x2="536" y2="98" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
<line x1="740" y1="98" x2="786" y2="98" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
<line x1="890" y1="146" x2="890" y2="246" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
<line x1="786" y1="298" x2="740" y2="298" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
<line x1="536" y1="298" x2="490" y2="298" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
<line x1="140" y1="246" x2="140" y2="150" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
<text x="155" y="200" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#b45309" text-anchor="start">the loop restarts</text>
</svg>
