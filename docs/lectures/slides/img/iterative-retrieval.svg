<svg xmlns="http://www.w3.org/2000/svg" width="920" height="210" viewBox="0 0 920 210" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker></defs>
<rect x="40" y="40" width="160" height="48" rx="7" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="120.0" y="69" font-size="13" fill="#111827" text-anchor="middle">retrieve</text>
<line x1="200" y1="64" x2="258" y2="64" stroke="#6b7280" stroke-width="1.8" marker-end="url(#m)"/>
<rect x="260" y="40" width="220" height="48" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="370.0" y="60" font-size="13" fill="#b45309" text-anchor="middle">assess: does this</text>
<text x="370.0" y="78" font-size="13" fill="#b45309" text-anchor="middle">answer the question?</text>
<line x1="480" y1="64" x2="538" y2="64" stroke="#6b7280" stroke-width="1.8" marker-end="url(#m)"/>
<text x="509.0" y="56.0" font-size="11" fill="#6b7280" text-anchor="middle">not yet</text>
<rect x="540" y="40" width="200" height="48" rx="7" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="640.0" y="60" font-size="13" fill="#111827" text-anchor="middle">reformulate the query</text>
<text x="640.0" y="78" font-size="13" fill="#111827" text-anchor="middle">with what was learned</text>
<path d="M 640 90 C 640 150, 130 150, 122 92" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#a)"/>
<text x="385" y="164" font-size="11" fill="#b45309" text-anchor="middle">retrieve again, until the quality bar is met or max iterations hit (the cost guardrail)</text>
<line x1="452" y1="88" x2="700" y2="148" stroke="#6b7280" stroke-width="1.8" marker-end="url(#m)"/>
<text x="560" y="110" font-size="11" fill="#6b7280" text-anchor="middle">good</text>
<rect x="702" y="130" width="120" height="44" rx="7" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
<text x="762.0" y="157" font-size="13" fill="#111827" text-anchor="middle">answer</text></svg>
