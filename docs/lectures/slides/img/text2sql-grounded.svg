<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" width="1080" height="470">
<defs>
<marker id="tq-ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#6b7280"/>
</marker>
<marker id="tq-arA" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#b45309"/>
</marker>
</defs>
<rect width="1080" height="470" fill="white"/>

<rect x="30" y="185" width="180" height="90" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="120" y="218" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle">THE QUESTION</text>
<text x="120" y="240" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">"What was Q3</text>
<text x="120" y="257" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">revenue by region?"</text>

<line x1="210" y1="210" x2="268" y2="130" stroke="#6b7280" stroke-width="1.7" marker-end="url(#tq-ar)"/>
<line x1="210" y1="250" x2="268" y2="330" stroke="#b45309" stroke-width="1.9" marker-end="url(#tq-arA)"/>

<text x="640" y="40" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle">UNGROUNDED: schema guessing</text>
<rect x="280" y="60" width="230" height="110" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8"/>
<text x="395" y="88" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#111827" text-anchor="middle">LLM + RAW SCHEMA</text>
<text x="395" y="110" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">hundreds of tables,</text>
<text x="395" y="127" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">three columns named revenue,</text>
<text x="395" y="144" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">no definitions anywhere</text>
<line x1="510" y1="115" x2="570" y2="115" stroke="#6b7280" stroke-width="1.7" marker-end="url(#tq-ar)"/>
<rect x="578" y="60" width="280" height="110" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8"/>
<text x="718" y="86" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#111827" text-anchor="middle">GUESSED SQL</text>
<text x="718" y="108" font-family="Courier, monospace" font-size="10.5" fill="#6b7280" text-anchor="middle">SELECT sum(rev_amt)   -- wrong col</text>
<text x="718" y="125" font-family="Courier, monospace" font-size="10.5" fill="#6b7280" text-anchor="middle">FROM ord_hdr_2        -- stale table</text>
<text x="718" y="142" font-family="Courier, monospace" font-size="10.5" fill="#6b7280" text-anchor="middle">-- cancelled orders included</text>
<line x1="858" y1="115" x2="918" y2="115" stroke="#6b7280" stroke-width="1.7" marker-end="url(#tq-ar)"/>
<rect x="926" y="72" width="130" height="86" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="991" y="105" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#111827" text-anchor="middle">PLAUSIBLE,</text>
<text x="991" y="124" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#111827" text-anchor="middle">AND WRONG</text>
<text x="991" y="145" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle">nobody notices</text>

<text x="640" y="240" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#b45309" text-anchor="middle">GROUNDED: definition lookup</text>
<rect x="280" y="260" width="230" height="120" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="395" y="288" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#b45309" text-anchor="middle">CATALOG LOOKUP</text>
<text x="395" y="310" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">the agent finds the metric:</text>
<text x="395" y="330" font-family="Courier, monospace" font-size="10.5" fill="#111827" text-anchor="middle">revenue = sum(order_total)</text>
<text x="395" y="347" font-family="Courier, monospace" font-size="10.5" fill="#111827" text-anchor="middle">where status = 'complete'</text>
<text x="395" y="368" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle">valid dimensions: time, region</text>
<line x1="510" y1="320" x2="570" y2="320" stroke="#b45309" stroke-width="1.8" marker-end="url(#tq-arA)"/>
<rect x="578" y="260" width="280" height="120" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="718" y="288" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">METRIC QUERY</text>
<text x="718" y="310" font-family="Courier, monospace" font-size="10.5" fill="#111827" text-anchor="middle">metric: revenue</text>
<text x="718" y="327" font-family="Courier, monospace" font-size="10.5" fill="#111827" text-anchor="middle">group_by: region  period: Q3</text>
<text x="718" y="350" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle">the layer compiles it to</text>
<text x="718" y="366" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle">correct, governed SQL</text>
<line x1="858" y1="320" x2="918" y2="320" stroke="#b45309" stroke-width="1.8" marker-end="url(#tq-arA)"/>
<rect x="926" y="277" width="130" height="86" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="991" y="310" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#b45309" text-anchor="middle">ONE ANSWER,</text>
<text x="991" y="329" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#b45309" text-anchor="middle">EVERYWHERE</text>
<text x="991" y="350" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle">auditable to the definition</text>

<text x="540" y="430" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#6b7280" text-anchor="middle">the same model, the same question: what changed is what the model was given to stand on --</text>
<text x="540" y="448" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#6b7280" text-anchor="middle">week 4's sql-rag lab built the ungrounded row and its guardrails by hand</text>
</svg>
