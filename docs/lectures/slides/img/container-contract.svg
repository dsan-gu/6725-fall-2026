<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450">
<defs>
<marker id="arrow-gray" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#6b7280"/>
</marker>
<marker id="arrow-amber" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#b45309"/>
</marker>
</defs>
<rect width="1000" height="450" fill="white"/>
<rect x="30" y="120" width="220" height="170" rx="8" fill="white" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
<text x="140" y="155" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">THE PLATFORM</text>
<text x="140" y="180" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">AgentCore, Cloud Run,</text>
<text x="140" y="198" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">Lambda, Kubernetes, ...</text>
<text x="140" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">health checks, routing,</text>
<text x="140" y="244" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">scaling, restarts</text>
<rect x="370" y="60" width="600" height="320" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="670" y="92" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">YOUR CONTAINER  (one image, any platform)</text>
<rect x="400" y="120" width="240" height="60" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="520" y="145" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">GET /ping</text>
<text x="520" y="165" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#b45309" text-anchor="middle">returns {"status": "Healthy"}</text>
<rect x="400" y="200" width="240" height="60" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="520" y="225" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">POST /invocations</text>
<text x="520" y="245" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#b45309" text-anchor="middle">prompt in, answer out</text>
<rect x="700" y="130" width="240" height="180" rx="8" fill="white" stroke="#6b7280" stroke-width="1.5"/>
<text x="820" y="160" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle">the agent you built</text>
<text x="820" y="184" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">model client</text>
<text x="820" y="203" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">agent loop (Strands)</text>
<text x="820" y="222" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">tools: get_weather(...)</text>
<text x="820" y="241" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">weeks 5-8, unchanged</text>
<line x1="640" y1="230" x2="696" y2="220" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
<line x1="250" y1="150" x2="396" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
<text x="320" y="140" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle">polls :8080</text>
<line x1="250" y1="230" x2="396" y2="230" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
<text x="320" y="220" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle">requests :8080</text>
<text x="500" y="420" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">the platform never sees your code, your framework, or your model choice: it sees two HTTP endpoints</text>
</svg>
