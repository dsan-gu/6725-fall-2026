<text x="660" y="90" font-size="14" fill="#374151">Without the cache: recompute</text>
<text x="660" y="110" font-size="14" fill="#374151">k and v for every past token,</text>
<text x="660" y="130" font-size="14" fill="#374151">on every step.</text>
<text x="660" y="166" font-size="14" fill="#374151">With the cache: compute only</text>
<text x="660" y="186" font-size="14" fill="#374151">q6, k6, v6 and read the rest.</text>
<text x="660" y="222" font-size="14" font-weight="bold" fill="#111827">Cost: one K and one V per token,</text>
<text x="660" y="242" font-size="14" font-weight="bold" fill="#111827">per layer, per head -- it adds up.</text>
