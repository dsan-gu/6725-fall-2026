<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker></defs>
<text x="110" y="40" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">BM25 ranking</text>
<rect x="40" y="58" width="140" height="30" rx="5" fill="#f3f4f6" stroke="#6b7280"/>
<text x="110" y="78" font-size="13" fill="#6b7280" text-anchor="middle">rank 1: D7  (1/61)</text>
<rect x="40" y="98" width="140" height="30" rx="5" fill="#fffbeb" stroke="#b45309"/>
<text x="110" y="118" font-size="13" fill="#b45309" text-anchor="middle">rank 2: D2  (1/62)</text>
<rect x="40" y="138" width="140" height="30" rx="5" fill="#f3f4f6" stroke="#6b7280"/>
<text x="110" y="158" font-size="13" fill="#6b7280" text-anchor="middle">rank 3: D9  (1/63)</text>
<text x="300" y="40" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">vector ranking</text>
<rect x="230" y="58" width="140" height="30" rx="5" fill="#fffbeb" stroke="#b45309"/>
<text x="300" y="78" font-size="13" fill="#b45309" text-anchor="middle">rank 1: D2  (1/61)</text>
<rect x="230" y="98" width="140" height="30" rx="5" fill="#f3f4f6" stroke="#6b7280"/>
<text x="300" y="118" font-size="13" fill="#6b7280" text-anchor="middle">rank 2: D5  (1/62)</text>
<rect x="230" y="138" width="140" height="30" rx="5" fill="#f3f4f6" stroke="#6b7280"/>
<text x="300" y="158" font-size="13" fill="#6b7280" text-anchor="middle">rank 3: D7  (1/63)</text>
<line x1="380" y1="120" x2="440" y2="120" stroke="#6b7280" stroke-width="1.8" marker-end="url(#f)"/>
<text x="450" y="40" font-size="14" font-weight="bold" fill="#111827">RRF score = sum of 1 / (60 + rank), across both lists</text>
<text x="450" y="66" font-size="14" fill="#b45309" font-weight="bold" font-family="Courier, monospace">D2: 1/62 + 1/61 = 0.03252</text>
<text x="450" y="106" font-size="14" fill="#374151" font-weight="normal" font-family="Courier, monospace">D7: 1/61 + 1/63 = 0.03227</text>
<text x="450" y="146" font-size="14" fill="#374151" font-weight="normal" font-family="Courier, monospace">D5: 1/62 = 0.01613</text>
<text x="450" y="186" font-size="14" fill="#374151" font-weight="normal" font-family="Courier, monospace">D9: 1/63 = 0.01587</text>
<text x="450" y="230" font-size="14" fill="#111827">Final order: D2 &#62; D7 &#62; D5 &#62; D9. D2 wins by ranking well in <tspan font-weight="bold">both</tspan> lists --</text>
<text x="450" y="250" font-size="14" fill="#111827">RRF never compares BM25 scores to cosine scores, only ranks.</text>
</svg>
