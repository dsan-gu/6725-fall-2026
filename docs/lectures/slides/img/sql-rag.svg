<svg xmlns="http://www.w3.org/2000/svg" width="920" height="260" viewBox="0 0 920 260" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker></defs>
<rect x="20" y="30" width="190" height="62" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="115.0" y="50" font-size="13" fill="#b45309" text-anchor="middle">"What was the average</text>
<text x="115.0" y="67" font-size="13" fill="#b45309" text-anchor="middle">trip distance on</text>
<text x="115.0" y="84" font-size="13" fill="#b45309" text-anchor="middle">Dec 11?"</text>
<line x1="210" y1="61" x2="250" y2="61" stroke="#6b7280" stroke-width="1.8" marker-end="url(#s)"/>
<rect x="252" y="30" width="170" height="62" rx="7" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="337.0" y="50" font-size="13" fill="#111827" text-anchor="middle">LLM writes SQL</text>
<text x="337.0" y="67" font-size="13" fill="#111827" text-anchor="middle">(sees table schema,</text>
<text x="337.0" y="84" font-size="13" fill="#111827" text-anchor="middle">never the rows)</text>
<line x1="422" y1="61" x2="462" y2="61" stroke="#6b7280" stroke-width="1.8" marker-end="url(#s)"/>
<rect x="464" y="18" width="230" height="86" rx="7" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
<text x="579.0" y="38" font-size="12" fill="#111827" text-anchor="middle" font-family="Courier, monospace">SELECT AVG(trip_distance)</text>
<text x="579.0" y="55" font-size="12" fill="#111827" text-anchor="middle" font-family="Courier, monospace">FROM trips</text>
<text x="579.0" y="72" font-size="12" fill="#111827" text-anchor="middle" font-family="Courier, monospace">WHERE pickup_date =</text>
<text x="579.0" y="89" font-size="12" fill="#111827" text-anchor="middle" font-family="Courier, monospace">  '2024-12-11';</text>
<line x1="694" y1="61" x2="734" y2="61" stroke="#6b7280" stroke-width="1.8" marker-end="url(#s)"/>
<rect x="736" y="30" width="160" height="62" rx="7" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="816.0" y="50" font-size="13" fill="#111827" text-anchor="middle">database executes:</text>
<text x="816.0" y="67" font-size="13" fill="#111827" text-anchor="middle">3.18 miles</text>
<text x="816.0" y="84" font-size="13" fill="#111827" text-anchor="middle">(exact, over 100K rows)</text>
<path d="M 816 94 C 816 150, 500 170, 215 160" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#s)"/>
<rect x="20" y="130" width="190" height="56" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="115.0" y="150" font-size="13" fill="#b45309" text-anchor="middle">grounded answer,</text>
<text x="115.0" y="167" font-size="13" fill="#b45309" text-anchor="middle">with the number</text>
<text x="20" y="225" font-size="13" fill="#374151">Aggregates (averages, counts, sums) need every row. No vector search can answer this -- the database computes,</text>
<text x="20" y="243" font-size="13" fill="#374151">the model translates and narrates. The risk to manage: the model must write correct SQL against your real schema.</text>
</svg>
