<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" width="920" height="350">
<defs>
<marker id="arrow-gray" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#6b7280"/>
</marker>
<marker id="arrow-ink" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#111827"/>
</marker>
<marker id="arrow-amber" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#b45309"/>
</marker>
</defs>
<rect width="920" height="350" fill="white"/>
<rect x="40" y="140" width="160" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="120" y="165" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">submitted</text>
<text x="120" y="184" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">task created</text>
<rect x="330" y="140" width="160" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="410" y="165" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">working</text>
<text x="410" y="184" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">agent is on it</text>
<rect x="710" y="140" width="170" height="56" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="795" y="165" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">completed</text>
<text x="795" y="184" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#b45309" text-anchor="middle">artifacts delivered</text>
<line x1="200" y1="168" x2="326" y2="168" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
<line x1="490" y1="168" x2="706" y2="168" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
<text x="598" y="158" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">work finishes</text>
<rect x="430" y="30" width="230" height="50" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="545" y="52" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">input-required</text>
<text x="545" y="70" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#b45309" text-anchor="middle">agent pauses and asks</text>
<line x1="430" y1="136" x2="470" y2="84" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
<text x="395" y="110" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#b45309" text-anchor="end">needs more info</text>
<line x1="590" y1="84" x2="475" y2="140" stroke="#b45309" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrow-amber)"/>
<text x="620" y="110" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#b45309" text-anchor="start">client replies</text>
<rect x="330" y="255" width="140" height="46" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="400" y="283" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">failed</text>
<rect x="520" y="255" width="140" height="46" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="590" y="283" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">canceled</text>
<line x1="390" y1="196" x2="390" y2="251" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
<text x="380" y="228" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="end">error</text>
<line x1="470" y1="196" x2="575" y2="251" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
<text x="560" y="228" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">client cancels</text>
<text x="460" y="333" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">input-required is the state a plain tool call cannot have: the task pauses, a human or agent answers, work resumes</text>
</svg>
