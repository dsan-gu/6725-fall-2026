<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" width="1080" height="470">
<defs>
<marker id="ij-ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#6b7280"/>
</marker>
<marker id="ij-arA" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#b45309"/>
</marker>
</defs>
<rect width="1080" height="470" fill="white"/>

<rect x="50" y="30" width="180" height="52" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="140" y="53" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle">APP A + AGENT</text>
<text x="140" y="71" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle">holds Alice's SSO ID token</text>
<rect x="330" y="30" width="190" height="52" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="425" y="53" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">ENTERPRISE IdP</text>
<text x="425" y="71" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle">the policy point</text>
<rect x="620" y="30" width="190" height="52" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="715" y="53" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle">APP B AUTH SERVER</text>
<text x="715" y="71" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle">trusts the IdP</text>
<rect x="890" y="30" width="160" height="52" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="970" y="53" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle">APP B MCP</text>
<text x="970" y="71" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle">the tools the agent needs</text>

<line x1="140" y1="82" x2="140" y2="430" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5,5"/>
<line x1="425" y1="82" x2="425" y2="430" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5,5"/>
<line x1="715" y1="82" x2="715" y2="430" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5,5"/>
<line x1="970" y1="82" x2="970" y2="430" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5,5"/>

<line x1="140" y1="125" x2="417" y2="125" stroke="#6b7280" stroke-width="1.7" marker-end="url(#ij-ar)"/>
<text x="278" y="116" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">token exchange: Alice's ID token + "target: App B"</text>

<rect x="345" y="145" width="160" height="40" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="425" y="162" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#b45309" text-anchor="middle">admin policy check:</text>
<text x="425" y="177" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#b45309" text-anchor="middle">may this agent reach App B?</text>

<line x1="425" y1="215" x2="148" y2="215" stroke="#b45309" stroke-width="1.8" marker-end="url(#ij-arA)"/>
<text x="286" y="206" font-family="Courier, monospace" font-size="11" fill="#b45309" text-anchor="middle">signed ID-JAG {sub: alice, aud: app-b}</text>

<line x1="140" y1="265" x2="707" y2="265" stroke="#6b7280" stroke-width="1.7" marker-end="url(#ij-ar)"/>
<text x="424" y="256" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">redeem the grant (JWT bearer)</text>

<line x1="715" y1="310" x2="148" y2="310" stroke="#6b7280" stroke-width="1.7" marker-end="url(#ij-ar)"/>
<text x="424" y="301" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">App B access token (App B applied its own rules)</text>

<line x1="140" y1="360" x2="962" y2="360" stroke="#6b7280" stroke-width="1.7" marker-end="url(#ij-ar)"/>
<text x="550" y="351" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">MCP calls with the App B token</text>

<text x="540" y="410" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#6b7280" text-anchor="middle">no consent screen, no password, no shared secret between A and B:</text>
<text x="540" y="427" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#6b7280" text-anchor="middle">the IdP vouches once, each app still applies its own authorization</text>
</svg>
