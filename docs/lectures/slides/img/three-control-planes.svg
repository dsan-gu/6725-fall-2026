<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" width="1080" height="500">
<defs>
<marker id="cp-ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#6b7280"/>
</marker>
</defs>
<rect width="1080" height="500" fill="white"/>

<rect x="420" y="190" width="240" height="120" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2.5"/>
<text x="540" y="225" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">THE DEPLOYED AGENT</text>
<text x="540" y="250" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">week 9's container:</text>
<text x="540" y="269" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">the loop, the tools,</text>
<text x="540" y="288" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">the model</text>

<rect x="60" y="60" width="280" height="130" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="200" y="92" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">IDENTITY: WHO</text>
<text x="200" y="115" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">authentication: the composite</text>
<text x="200" y="133" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">credential names the user AND</text>
<text x="200" y="151" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">the agent acting for them</text>
<text x="200" y="175" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#6b7280" text-anchor="middle">token exchange, workload identity</text>
<line x1="300" y1="190" x2="450" y2="240" stroke="#6b7280" stroke-width="1.8" marker-end="url(#cp-ar)"/>

<rect x="740" y="60" width="280" height="130" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="880" y="92" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">POLICY: MAY</text>
<text x="880" y="115" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">authorization: rules evaluated</text>
<text x="880" y="133" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">per identity and resource,</text>
<text x="880" y="151" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">kept as code outside the app</text>
<text x="880" y="175" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#6b7280" text-anchor="middle">Cedar, Rego, fine-grained authz</text>
<line x1="780" y1="190" x2="630" y2="240" stroke="#6b7280" stroke-width="1.8" marker-end="url(#cp-ar)"/>

<rect x="400" y="20" width="280" height="110" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="540" y="52" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">GUARDRAILS: DOES</text>
<text x="540" y="75" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">runtime checks on content and actions,</text>
<text x="540" y="93" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">whoever is asking: input, tool, output rails</text>
<text x="540" y="116" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#6b7280" text-anchor="middle">because authorized requests still go wrong</text>
<line x1="540" y1="130" x2="540" y2="182" stroke="#6b7280" stroke-width="1.8" marker-end="url(#cp-ar)"/>

<rect x="300" y="380" width="480" height="80" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="540" y="412" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle">OBSERVABILITY: RECORDS</text>
<text x="540" y="436" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">every authentication, policy decision, and rail verdict lands in the trace (week 7)</text>
<line x1="540" y1="310" x2="540" y2="374" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#cp-ar)"/>

<text x="140" y="320" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#6b7280" text-anchor="start">identity without policy is a name with no rules;</text>
<text x="140" y="338" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#6b7280" text-anchor="start">policy without rails trusts every authorized request;</text>
<text x="140" y="356" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#6b7280" text-anchor="start">rails without observability cannot be evaluated</text>
</svg>
