<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" width="1080" height="500">
<defs>
<marker id="sl-ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#6b7280"/>
</marker>
<marker id="sl-arA" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#b45309"/>
</marker>
</defs>
<rect width="1080" height="500" fill="white"/>

<rect x="120" y="20" width="220" height="70" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8"/>
<text x="230" y="50" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle">BI DASHBOARDS</text>
<text x="230" y="70" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">"Q3 revenue by region"</text>

<rect x="430" y="20" width="220" height="70" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8"/>
<text x="540" y="50" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle">NOTEBOOKS</text>
<text x="540" y="70" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">same metric, same number</text>

<rect x="740" y="20" width="220" height="70" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2.2"/>
<text x="850" y="50" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle">AGENTS (MCP)</text>
<text x="850" y="70" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">query concepts as tools</text>

<line x1="230" y1="90" x2="330" y2="160" stroke="#6b7280" stroke-width="1.6" marker-end="url(#sl-ar)"/>
<line x1="540" y1="90" x2="540" y2="160" stroke="#6b7280" stroke-width="1.6" marker-end="url(#sl-ar)"/>
<line x1="850" y1="90" x2="750" y2="160" stroke="#6b7280" stroke-width="1.6" marker-end="url(#sl-ar)"/>
<text x="625" y="130" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start">everyone asks for CONCEPTS</text>

<rect x="140" y="165" width="800" height="150" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
<text x="540" y="193" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">THE SEMANTIC LAYER</text>
<text x="540" y="220" font-family="Courier, monospace" font-size="13" fill="#111827" text-anchor="middle">revenue = sum(order_total) where status = 'complete'</text>
<text x="540" y="244" font-family="Courier, monospace" font-size="13" fill="#111827" text-anchor="middle">active_customer = purchase within last 90 days</text>
<text x="540" y="270" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">dimensions: time, region, product hierarchy  ·  entities and joins  ·  row and column policy</text>
<text x="540" y="298" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#b45309" text-anchor="middle">one agreed definition of every business word, written once, governed</text>

<line x1="430" y1="315" x2="380" y2="385" stroke="#b45309" stroke-width="1.8" marker-end="url(#sl-arA)"/>
<line x1="650" y1="315" x2="700" y2="385" stroke="#b45309" stroke-width="1.8" marker-end="url(#sl-arA)"/>
<text x="540" y="355" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#b45309" text-anchor="middle">compiles to correct, governed SQL</text>

<rect x="180" y="390" width="330" height="85" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8"/>
<text x="345" y="417" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle">WAREHOUSE</text>
<text x="345" y="440" font-family="Courier, monospace" font-size="11.5" fill="#6b7280" text-anchor="middle">ord_hdr_2  cust_mstr  li_dtl_v3</text>
<text x="345" y="460" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">hundreds of tables, cryptic names</text>

<rect x="570" y="390" width="330" height="85" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8"/>
<text x="735" y="417" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle">LAKE AND OPERATIONAL STORES</text>
<text x="735" y="440" font-family="Courier, monospace" font-size="11.5" fill="#6b7280" text-anchor="middle">events/  logs/  crm_export/</text>
<text x="735" y="460" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">raw, ungoverned, ever-changing</text>
