<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" width="1080" height="480">
<defs>
<marker id="sq-ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#6b7280"/>
</marker>
<marker id="sq-arA" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#b45309"/>
</marker>
</defs>
<rect width="1080" height="480" fill="white"/>

<rect x="120" y="30" width="220" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="230" y="55" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">CLIENT AGENT</text>
<text x="230" y="75" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">A2AAgent(endpoint=...)</text>
<rect x="740" y="30" width="220" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="850" y="55" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">REMOTE AGENT</text>
<text x="850" y="75" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">A2AServer(agent=...) on :9000</text>

<line x1="230" y1="86" x2="230" y2="440" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,5"/>
<line x1="850" y1="86" x2="850" y2="440" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,5"/>

<line x1="230" y1="130" x2="842" y2="130" stroke="#6b7280" stroke-width="1.8" marker-end="url(#sq-ar)"/>
<text x="540" y="122" font-family="Courier, monospace" font-size="12.5" fill="#111827" text-anchor="middle">GET /.well-known/agent-card.json</text>

<line x1="850" y1="170" x2="238" y2="170" stroke="#6b7280" stroke-width="1.8" marker-end="url(#sq-ar)"/>
<text x="540" y="162" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">agent card: skills, auth schemes, capabilities {streaming: true}</text>

<line x1="230" y1="225" x2="842" y2="225" stroke="#6b7280" stroke-width="1.8" marker-end="url(#sq-ar)"/>
<text x="540" y="217" font-family="Courier, monospace" font-size="12.5" fill="#111827" text-anchor="middle">SendStreamingMessage {"parts": [{"text": "..."}]}</text>

<line x1="850" y1="275" x2="238" y2="275" stroke="#6b7280" stroke-width="1.8" marker-end="url(#sq-ar)"/>
<text x="540" y="267" font-family="Courier, monospace" font-size="12" fill="#6b7280" text-anchor="middle">SSE  data: {"task": {... "state": "TASK_STATE_WORKING"}}</text>

<line x1="850" y1="325" x2="238" y2="325" stroke="#b45309" stroke-width="1.8" marker-end="url(#sq-arA)"/>
<text x="540" y="317" font-family="Courier, monospace" font-size="12" fill="#b45309" text-anchor="middle">SSE  data: {"artifactUpdate": {"artifact": {"parts": [...]}}}</text>

<line x1="850" y1="375" x2="238" y2="375" stroke="#6b7280" stroke-width="1.8" marker-end="url(#sq-ar)"/>
<text x="540" y="367" font-family="Courier, monospace" font-size="12" fill="#6b7280" text-anchor="middle">SSE  data: {"statusUpdate": {... "state": "TASK_STATE_COMPLETED"}}</text>

<text x="230" y="425" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle" font-style="italic">one round trip, discovery included;</text>
<text x="230" y="441" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle" font-style="italic">the answer arrives as artifacts</text>
<text x="850" y="425" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle" font-style="italic">a very long task swaps SSE for a</text>
<text x="850" y="441" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle" font-style="italic">webhook push to the client's URL</text>
</svg>
