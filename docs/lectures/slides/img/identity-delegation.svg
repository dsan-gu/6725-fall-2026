<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" width="1080" height="430">
<defs>
<marker id="id-ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#6b7280"/>
</marker>
<marker id="id-arA" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
  <polygon points="0 0, 9 3.5, 0 7" fill="#b45309"/>
</marker>
</defs>
<rect width="1080" height="430" fill="white"/>

<rect x="30" y="60" width="170" height="90" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="115" y="95" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">ALICE</text>
<text x="115" y="117" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">logs in once;</text>
<text x="115" y="134" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">holds broad scopes</text>

<line x1="200" y1="105" x2="292" y2="105" stroke="#6b7280" stroke-width="1.8" marker-end="url(#id-ar)"/>
<text x="246" y="93" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">user token</text>

<rect x="300" y="60" width="190" height="90" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2.5"/>
<text x="395" y="95" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">THE AGENT</text>
<text x="395" y="117" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">its own workload identity;</text>
<text x="395" y="134" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">must act FOR Alice</text>

<rect x="330" y="230" width="420" height="160" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="540" y="258" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#b45309" text-anchor="middle">TOKEN EXCHANGE (RFC 8693)</text>
<text x="540" y="280" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">in: Alice's token (subject) + the agent's identity (actor)</text>
<text x="540" y="298" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">out: a new, narrower token that names them both</text>
<text x="540" y="327" font-family="Courier, monospace" font-size="12" fill="#111827" text-anchor="middle">{"sub": "alice", "act": {"sub": "travel-agent"},</text>
<text x="540" y="346" font-family="Courier, monospace" font-size="12" fill="#111827" text-anchor="middle"> "scope": "bookings:write", "exp": "+15m"}</text>
<text x="540" y="374" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#b45309" text-anchor="middle">downscoped: Alice can do much more than bookings; this token cannot</text>

<line x1="395" y1="150" x2="420" y2="224" stroke="#b45309" stroke-width="1.8" marker-end="url(#id-arA)"/>
<text x="330" y="190" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="end">exchange at the</text>
<text x="330" y="206" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="end">authorization server</text>

<line x1="660" y1="224" x2="700" y2="150" stroke="#b45309" stroke-width="1.8" marker-end="url(#id-arA)"/>
<text x="740" y="190" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="start">delegated token,</text>
<text x="740" y="206" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="start">15 minutes, one job</text>

<rect x="620" y="60" width="200" height="90" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="720" y="95" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">BOOKINGS API</text>
<text x="720" y="117" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">sees who it is for (sub)</text>
<text x="720" y="134" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">and who is acting (act)</text>
<line x1="490" y1="105" x2="612" y2="105" stroke="#6b7280" stroke-width="1.8" marker-end="url(#id-ar)"/>
<text x="551" y="93" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">call with it</text>

<rect x="880" y="60" width="170" height="90" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="965" y="95" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle">AUDIT LOG</text>
<text x="965" y="117" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">"travel-agent booked,</text>
<text x="965" y="134" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">on behalf of alice"</text>
<line x1="820" y1="105" x2="872" y2="105" stroke="#6b7280" stroke-width="1.6" marker-end="url(#id-ar)"/>
</svg>
