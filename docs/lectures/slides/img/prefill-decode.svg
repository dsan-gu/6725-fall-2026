<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/></marker></defs>
<text x="30" y="34" font-size="16" font-weight="bold" fill="#111827">Prefill: the whole prompt at once</text>
<rect x="30" y="55" width="70" height="30" rx="5" fill="#f3f4f6" stroke="#6b7280"/>
<text x="65" y="75" font-size="13" fill="#111827" text-anchor="middle">Explain</text>
<line x1="65" y1="88" x2="65" y2="108" stroke="#374151" stroke-width="1.5" marker-end="url(#m)"/>
<rect x="108" y="55" width="70" height="30" rx="5" fill="#f3f4f6" stroke="#6b7280"/>
<text x="143" y="75" font-size="13" fill="#111827" text-anchor="middle">KV</text>
<line x1="143" y1="88" x2="143" y2="108" stroke="#374151" stroke-width="1.5" marker-end="url(#m)"/>
<rect x="186" y="55" width="70" height="30" rx="5" fill="#f3f4f6" stroke="#6b7280"/>
<text x="221" y="75" font-size="13" fill="#111827" text-anchor="middle">caching</text>
<line x1="221" y1="88" x2="221" y2="108" stroke="#374151" stroke-width="1.5" marker-end="url(#m)"/>
<rect x="264" y="55" width="70" height="30" rx="5" fill="#f3f4f6" stroke="#6b7280"/>
<text x="299" y="75" font-size="13" fill="#111827" text-anchor="middle">in</text>
<line x1="299" y1="88" x2="299" y2="108" stroke="#374151" stroke-width="1.5" marker-end="url(#m)"/>
<rect x="342" y="55" width="70" height="30" rx="5" fill="#f3f4f6" stroke="#6b7280"/>
<text x="377" y="75" font-size="13" fill="#111827" text-anchor="middle">vLLM</text>
<line x1="377" y1="88" x2="377" y2="108" stroke="#374151" stroke-width="1.5" marker-end="url(#m)"/>
<rect x="30" y="112" width="382" height="34" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
<text x="221" y="134" font-size="14" fill="#111827" text-anchor="middle">one parallel pass through the model</text>
<text x="30" y="172" font-size="13" fill="#6b7280">compute-bound: GPUs love this</text>
<text x="510" y="34" font-size="16" font-weight="bold" fill="#111827">Decode: one token at a time</text>
<rect x="510" y="55" width="78" height="30" rx="5" fill="#fffbeb" stroke="#b45309"/>
<text x="549" y="75" font-size="13" fill="#111827" text-anchor="middle">The</text>
<line x1="590" y1="70" x2="608" y2="70" stroke="#b45309" stroke-width="2" marker-end="url(#m)"/>
<rect x="610" y="55" width="78" height="30" rx="5" fill="#fffbeb" stroke="#b45309"/>
<text x="649" y="75" font-size="13" fill="#111827" text-anchor="middle">KV</text>
<line x1="690" y1="70" x2="708" y2="70" stroke="#b45309" stroke-width="2" marker-end="url(#m)"/>
<rect x="710" y="55" width="78" height="30" rx="5" fill="#fffbeb" stroke="#b45309"/>
<text x="749" y="75" font-size="13" fill="#111827" text-anchor="middle">cache</text>
<line x1="790" y1="70" x2="808" y2="70" stroke="#b45309" stroke-width="2" marker-end="url(#m)"/>
<rect x="810" y="55" width="78" height="30" rx="5" fill="#ffffff" stroke="#9ca3af"/>
<text x="849" y="75" font-size="13" fill="#111827" text-anchor="middle">...</text>
<text x="510" y="115" font-size="13" fill="#6b7280">each step re-reads all model weights + the KV cache</text>
<text x="510" y="135" font-size="13" fill="#6b7280">memory-bandwidth-bound: GPUs mostly wait</text>
<line x1="30" y1="220" x2="890" y2="220" stroke="#374151" stroke-width="2"/>
<line x1="30" y1="212" x2="30" y2="228" stroke="#374151" stroke-width="2"/>
<text x="30" y="250" font-size="12" fill="#6b7280">request arrives</text>
<circle cx="430" cy="220" r="6" fill="#b45309"/>
<text x="430" y="250" font-size="12" fill="#b45309" text-anchor="middle">first token out</text>
<circle cx="560" cy="220" r="5" fill="#b45309" opacity="0.6"/>
<circle cx="690" cy="220" r="5" fill="#b45309" opacity="0.6"/>
<circle cx="820" cy="220" r="5" fill="#b45309" opacity="0.6"/>
<path d="M 30 198 L 430 198" stroke="#111827" stroke-width="1.2" marker-end="url(#m)" marker-start="url(#m)" fill="none"/>
<text x="230" y="190" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle">TTFT (time to first token) = prefill</text>
<path d="M 560 198 L 690 198" stroke="#b45309" stroke-width="1.2" marker-end="url(#m)" marker-start="url(#m)" fill="none"/>
<text x="625" y="190" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">TPOT (per output token)</text>
</svg>
